# ===== WAL / Write Performance =====
wal_level = minimal
max_wal_senders = 0
synchronous_commit = off
wal_buffers = 8MB
fsync = off
full_page_writes = off
wal_compression = on

# ===== Network =====
listen_addresses = '*'
port = 5432

max_connections = 100
shared_buffers = 256MB
dynamic_shared_memory_type = posix
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 1GB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
